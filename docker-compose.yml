services:
  nginx:
    image: nginx:1.31.1
    container_name: lab14_nginx
    ports:
      - "4001:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - frontend
      - backend

  php:
    image: php:8.2-fpm
    container_name: lab14_php
    volumes:
      - ./src:/var/www/html
    networks:
      - backend

  mysql:
    image: mysql:8.0
    container_name: lab14_mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: lab14_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD_FILE: /run/secrets/panel_root_password
    secrets:
      - panel_root_password
    ports:
      - "6001:80"
    depends_on:
      - mysql
    networks:
      - backend
      - frontend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  mysql_data:

secrets:
  db_root_password:
    file: db_root_password.txt
  panel_root_password:
    file: panel_root_password.txt
